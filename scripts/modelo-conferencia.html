<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conferir coordenadas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  :root { --fundo: #f7f6f2; --texto: #1d1d1b; --suave: #5b5a55; --borda: #d9d6cc; --painel: #fff;
          --pendente: #c2410c; --conferir: #1d4ed8; --ok: #15803d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); background: var(--fundo);
         display: grid; grid-template-columns: 380px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / -1; padding: 10px 16px; background: var(--painel); border-bottom: 1px solid var(--borda); }
  header h1 { margin: 0; font-size: 1.05rem; }
  header p { margin: 4px 0 0; color: var(--suave); }
  aside { overflow-y: auto; padding: 12px 16px; border-right: 1px solid var(--borda); background: var(--painel); }
  #mapa { height: 100%; }
  .item { border: 1px solid var(--borda); border-left: 4px solid var(--pendente); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }
  .item.a-conferir { border-left-color: var(--conferir); }
  .item.feito { border-left-color: var(--ok); background: #f0fdf4; }
  .item h2 { font-size: .95rem; margin: 0 0 2px; }
  .item .meta { color: var(--suave); font-size: .82rem; }
  .item p { margin: 4px 0; font-size: .85rem; }
  .item .botoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  button { font: inherit; font-size: .82rem; padding: 4px 8px; border: 1px solid var(--borda); background: #fff; border-radius: 4px; cursor: pointer; }
  button:hover { background: var(--fundo); }
  .selo { display: inline-block; font-size: .72rem; padding: 0 6px; border-radius: 9px; color: #fff; background: var(--pendente); vertical-align: 1px; }
  .a-conferir .selo { background: var(--conferir); }
  .feito .selo { background: var(--ok); }
  textarea { width: 100%; height: 140px; font: 12px/1.4 ui-monospace, Consolas, monospace; }
  h3 { font-size: .9rem; margin: 16px 0 6px; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 50vh 1fr; }
    aside { grid-row: 3; border-right: 0; border-top: 1px solid var(--borda); }
    #mapa { grid-row: 2; }
  }
</style>
</head>
<body>
<header>
  <h1>Conferir coordenadas — Mapa Infância Cotia</h1>
  <p>Arraste cada marcador até o prédio certo (use a camada Satélite) ou clique em “Aceitar este ponto”. No fim, copie o texto do quadro e mande para o Claude. Gerado em {{HOJE}}.</p>
</header>
<aside>
  <div id="lista"></div>
  <h3>Resultado (coordenadas-manuais.csv)</h3>
  <textarea id="saida" readonly></textarea>
  <button id="copiar">Copiar</button>
</aside>
<div id="mapa"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
const ITENS = /*DADOS*/[];
const CONTORNO = /*CONTORNO*/null;
const HOJE = "{{HOJE}}";

// Tiles do OSM exigem Referer: abra esta página por http://localhost, não com duplo clique no arquivo.
const ruas = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
});
const satelite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, attribution: "Imagens &copy; Esri, Maxar, Earthstar Geographics",
});
const mapa = L.map("mapa", { layers: [ruas] }).setView([-23.64, -46.95], 11);
L.control.layers({ "Ruas": ruas, "Satélite": satelite }).addTo(mapa);
if (CONTORNO) L.geoJSON(CONTORNO, { style: { color: "#1d1d1b", weight: 2, fill: false, dashArray: "6 4" }, interactive: false }).addTo(mapa);

const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const decididos = new Map();

function icone(cor) {
  return L.divIcon({ className: "", iconSize: [22, 22], iconAnchor: [11, 11],
    html: `<div style="width:22px;height:22px;border-radius:50%;background:${cor};border:3px solid #fff;box-shadow:0 0 0 1px #0006"></div>` });
}
const COR = { "pendente": "#c2410c", "a conferir": "#1d4ed8", "feito": "#15803d" };

function atualizarSaida() {
  const linhas = ["id,lat,lon,justificativa"];
  for (const [id, d] of decididos) linhas.push(`${id},${d.lat.toFixed(6)},${d.lon.toFixed(6)},"${d.como} na conferência de ${HOJE}"`);
  document.getElementById("saida").value = linhas.join("\n");
}

function decidir(item, card, marcador, como) {
  const { lat, lng } = marcador.getLatLng();
  decididos.set(item.id, { lat, lon: lng, como });
  card.classList.add("feito");
  card.querySelector(".selo").textContent = como;
  marcador.setIcon(icone(COR.feito));
  atualizarSaida();
}

const lista = document.getElementById("lista");
const limites = [];
for (const item of ITENS) {
  const marcador = L.marker([item.lat, item.lon], { draggable: true, icon: icone(COR[item.grupo]), title: item.nome }).addTo(mapa);
  marcador.bindTooltip(item.nome);
  limites.push([item.lat, item.lon]);
  const card = document.createElement("div");
  card.className = "item" + (item.grupo === "a conferir" ? " a-conferir" : "");
  card.innerHTML = `<h2>${esc(item.nome)} <span class="selo">${esc(item.grupo)}</span></h2>
    <div class="meta">${esc(item.id)} · ${esc(item.endereco)}</div>
    <p>${esc(item.motivo)}</p>${item.referencia ? `<p><strong>Referência:</strong> ${esc(item.referencia)}</p>` : ""}
    <div class="botoes"><button data-a="ver">Ver no mapa</button><button data-a="aceitar">Aceitar este ponto</button></div>`;
  card.querySelector('[data-a="ver"]').onclick = () => { mapa.setView(marcador.getLatLng(), 17); marcador.openTooltip(); };
  card.querySelector('[data-a="aceitar"]').onclick = () => decidir(item, card, marcador, "aceito");
  marcador.on("dragend", () => decidir(item, card, marcador, "ajustado"));
  lista.appendChild(card);
}
if (limites.length) mapa.fitBounds(limites, { padding: [30, 30] });
atualizarSaida();
document.getElementById("copiar").onclick = () => {
  const t = document.getElementById("saida"); t.select();
  navigator.clipboard?.writeText(t.value).catch(() => document.execCommand("copy"));
};
</script>
</body>
</html>
